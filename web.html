<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGPU Depth Estimation Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.8em;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  button {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 1em;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .videos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 768px) {
    .videos { grid-template-columns: 1fr; }
  }
  .panel {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 15px;
    backdrop-filter: blur(10px);
  }
  .panel h3 {
    margin-bottom: 10px;
    color: #a78bfa;
    font-size: 1.1em;
  }
  video, canvas {
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .stats {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
  }
  .stat-item {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: 8px;
  }
  .stat-label {
    font-size: 0.85em;
    color: #9ca3af;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 1.2em;
    font-weight: 600;
    color: #60a5fa;
  }
  #status {
    text-align: center;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
  }
  #status.loading { color: #fbbf24; }
  #status.success { color: #34d399; }
  #status.error { color: #f87171; }
  .log {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    padding: 15px;
    font-family: "Monaco", "Courier New", monospace;
    font-size: 0.85em;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .log-line { margin-bottom: 4px; }
  .log-line.info { color: #60a5fa; }
  .log-line.success { color: #34d399; }
  .log-line.error { color: #f87171; }
  .log-line.warn { color: #fbbf24; }
</style>
</head>
<body>
<div class="container">
  <h1>🔮 WebGPU Depth Estimation Tester</h1>
  <div id="status">Click "Start" to initialize the webcam and load the depth model.</div>

  <div class="controls">
    <button id="startBtn">▶️ Start</button>
    <button id="runOnceBtn" disabled>🎯 Run Once</button>
    <button id="runLoopBtn" disabled>🔄 Run Loop</button>
    <button id="stopBtn" disabled>⏹ Stop</button>
  </div>

  <div class="videos">
    <div class="panel">
      <h3>📹 Webcam Feed</h3>
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div class="panel">
      <h3>🌫️ Depth Map</h3>
      <canvas id="depthCanvas"></canvas>
    </div>
  </div>

  <div class="stats">
    <h3 style="margin-bottom: 15px; color: #a78bfa;">📊 Inference Stats</h3>
    <div class="stat-grid">
      <div class="stat-item">
        <div class="stat-label">Inference Time</div>
        <div class="stat-value" id="statTime">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Average (last 10)</div>
        <div class="stat-value" id="statAvg">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">FPS</div>
        <div class="stat-value" id="statFps">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Depth Map Size</div>
        <div class="stat-value" id="statSize">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Depth Type</div>
        <div class="stat-value" id="statType">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Min / Max</div>
        <div class="stat-value" id="statRange">—</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h3>📋 Console Log</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script type="module">
const video = document.getElementById("webcam");
const depthCanvas = document.getElementById("depthCanvas");
const depthCtx = depthCanvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const startBtn = document.getElementById("startBtn");
const runOnceBtn = document.getElementById("runOnceBtn");
const runLoopBtn = document.getElementById("runLoopBtn");
const stopBtn = document.getElementById("stopBtn");

let estimatorGPU = null;
let RawImageClass = null;
let loopRunning = false;
let isInferring = false; // Lock to prevent "Session already started" errors
let times = [];

function setStatus(msg, type = "") {
  statusEl.textContent = msg;
  statusEl.className = type;
}

function log(msg, type = "info") {
  const line = document.createElement("div");
  line.className = `log-line ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

async function startWebcam() {
  log("Requesting webcam access...");
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise((r) => (video.onloadedmetadata = r));
  await video.play();
  log(`Webcam started: ${video.videoWidth}x${video.videoHeight}`, "success");
}

async function loadModel() {
  setStatus("Loading Hugging Face Transformers.js...", "loading");
  log("Importing transformers.js (v3 latest)...");
  
  // FIX 1: Upgraded to @3 (latest v3 patch). 
  // v3.0.0 had a known bug causing "Session already started" errors in WebGPU. 
  // Later v3.x versions introduced an internal inference queue to fix this.
  const transformers = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3");
  const { pipeline, env, RawImage } = transformers;
  
  RawImageClass = RawImage;

  setStatus("Loading depth-anything-v2-small model (WebGPU)...", "loading");
  log("Creating depth estimation pipeline (device: webgpu)...");

  try {
    estimatorGPU = await pipeline(
      "depth-estimation",
      "onnx-community/depth-anything-v2-small",
      { device: "webgpu", dtype: "fp32" }
    );
    log("GPU model loaded ✅", "success");
    setStatus("Model loaded! Ready to run inference.", "success");
  } catch (err) {
    log(`WebGPU failed: ${err.message}`, "error");
    log("Falling back to WASM...", "warn");
    setStatus("WebGPU unavailable. Falling back to WASM...", "loading");
    estimatorGPU = await pipeline(
      "depth-estimation",
      "onnx-community/depth-anything-v2-small",
      { device: "wasm", dtype: "fp32" }
    );
    log("WASM model loaded (fallback)", "success");
    setStatus("Model loaded (WASM fallback). Ready.", "success");
  }
}

function grabFrame() {
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
  return new RawImageClass(data, width, height, 4);
}

function renderDepthMap(result) {
  const w = result.depth.width;
  const h = result.depth.height;
  const c = result.depth.channels; 
  depthCanvas.width = w;
  depthCanvas.height = h;

  const data = result.depth.data;
  let min = Infinity, max = -Infinity;
  
  for (let i = 0; i < data.length; i += c) {
    if (data[i] < min) min = data[i];
    if (data[i] > max) max = data[i];
  }

  const img = depthCtx.createImageData(w, h);
  
  if (c === 1) {
    for (let i = 0; i < data.length; i++) {
      const v = data[i];
      const idx = i * 4;
      img.data[idx] = v;
      img.data[idx + 1] = v;
      img.data[idx + 2] = v;
      img.data[idx + 3] = 255;
    }
  } else {
    for (let i = 0; i < w * h; i++) {
      const idx = i * 4;
      img.data[idx] = data[i * c];
      img.data[idx + 1] = data[i * c + (c > 1 ? 1 : 0)];
      img.data[idx + 2] = data[i * c + (c > 2 ? 2 : 0)];
      img.data[idx + 3] = 255;
    }
  }
  
  depthCtx.putImageData(img, 0, 0);
  return { min, max };
}

async function runInference() {
  if (!estimatorGPU) {
    log("Model not loaded yet!", "error");
    return;
  }

  // FIX 2: Concurrency lock. Prevents sending a new frame to the WebWorker 
  // before the previous WebGPU session has fully flushed and reset.
  if (isInferring) return; 
  isInferring = true;

  try {
    const frameImg = grabFrame();
    const t0 = performance.now();
    const result = await estimatorGPU(frameImg);
    const t1 = performance.now();
    const ms = t1 - t0;

    times.push(ms);
    if (times.length > 10) times.shift();

    const { min, max } = renderDepthMap(result);
    const avg = times.reduce((a, b) => a + b, 0) / times.length;
    const fps = 1000 / avg;

    log(`Inference time (WebGPU): ${ms.toFixed(1)} ms`, "success");
    log(`Depth map size: ${result.depth.width} x ${result.depth.height}`);
    log(`Depth map type: ${result.depth.constructor.name === 'm' ? 'RawImage' : result.depth.constructor.name}`);
    log(`Sample values: ${Array.from(result.depth.data.slice(0, 5)).join(", ")}`);
    log(`Min: ${min.toFixed(0)}, Max: ${max.toFixed(0)}`);

    document.getElementById("statTime").textContent = `${ms.toFixed(1)} ms`;
    document.getElementById("statAvg").textContent = `${avg.toFixed(1)} ms`;
    document.getElementById("statFps").textContent = `${fps.toFixed(1)} fps`;
    document.getElementById("statSize").textContent = `${result.depth.width}×${result.depth.height}`;
    document.getElementById("statType").textContent = result.depth.constructor.name === 'm' ? 'RawImage' : result.depth.constructor.name;
    document.getElementById("statRange").textContent = `${min.toFixed(0)} / ${max.toFixed(0)}`;
    
    // Small delay to allow WebGPU command buffer to fully clear
    await new Promise(r => setTimeout(r, 5));
  } catch (err) {
    log(`Inference error: ${err.message}`, "error");
  } finally {
    isInferring = false;
  }
}

async function runLoop() {
  loopRunning = true;
  while (loopRunning) {
    await runInference();
    // FIX 3: Use requestAnimationFrame instead of setTimeout for smoother sync with webcam
    await new Promise(r => requestAnimationFrame(r));
  }
}

async function initialize() {
  startBtn.disabled = true;
  try {
    await startWebcam();
    await loadModel();
    runOnceBtn.disabled = false;
    runLoopBtn.disabled = false;
  } catch (err) {
    log(`Init failed: ${err.message}`, "error");
    setStatus(`Error: ${err.message}`, "error");
    startBtn.disabled = false;
  }
}

startBtn.addEventListener("click", initialize);
runOnceBtn.addEventListener("click", runInference);
runLoopBtn.addEventListener("click", () => {
  runLoopBtn.disabled = true;
  stopBtn.disabled = false;
  runLoop();
});
stopBtn.addEventListener("click", () => {
  loopRunning = false;
  runLoopBtn.disabled = false;
  stopBtn.disabled = true;
  log("Loop stopped.", "warn");
});
</script>
</body>
</html>
