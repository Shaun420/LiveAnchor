<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Depth Estimation Tester — WASM / WebGPU</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.8em;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .settings {
    display: flex;
    gap: 15px;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .settings label { font-size: 0.9em; color: #9ca3af; }
  select {
    background: rgba(255,255,255,0.1);
    color: #e0e0e0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.95em;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  button {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 1em;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .videos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 768px) { .videos { grid-template-columns: 1fr; } }
  .panel {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 15px;
    backdrop-filter: blur(10px);
  }
  .panel h3 { margin-bottom: 10px; color: #a78bfa; font-size: 1.1em; }
  video, canvas {
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .stats {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 15px;
  }
  .stat-item { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; }
  .stat-label { font-size: 0.85em; color: #9ca3af; margin-bottom: 4px; }
  .stat-value { font-size: 1.15em; font-weight: 600; color: #60a5fa; }
  #status {
    text-align: center;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
  }
  #status.loading { color: #fbbf24; }
  #status.success { color: #34d399; }
  #status.error { color: #f87171; }
  .log {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    padding: 15px;
    font-family: "Monaco", "Courier New", monospace;
    font-size: 0.85em;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .log-line { margin-bottom: 4px; }
  .log-line.info { color: #60a5fa; }
  .log-line.success { color: #34d399; }
  .log-line.error { color: #f87171; }
  .log-line.warn { color: #fbbf24; }
</style>
</head>
<body>
<div class="container">
  <h1>🔮 Depth Estimation Tester — WASM / WebGPU</h1>
  <div id="status">Configure your backend, then click "Start".</div>

  <div class="settings">
    <label>Backend:
      <select id="deviceSel">
        <option value="wasm" selected>WASM (CPU)</option>
        <option value="webgpu">WebGPU</option>
      </select>
    </label>
    <label>Precision:
      <select id="dtypeSel">
        <option value="q8" selected>q8 (quantized, fastest)</option>
        <option value="fp32">fp32 (full precision)</option>
        <option value="fp16">fp16 (WebGPU only)</option>
        <option value="q4">q4 (smallest)</option>
      </select>
    </label>
    <label>Input size:
      <select id="sizeSel">
        <option value="native" id="nativeOpt">native (loading...)</option>
        <option value="512">512×512</option>
        <option value="384" selected>384×384</option>
        <option value="256">256×256</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button id="startBtn">▶️ Start</button>
    <button id="runOnceBtn" disabled>🎯 Run Once</button>
    <button id="runLoopBtn" disabled>🔄 Run Loop</button>
    <button id="stopBtn" disabled>⏹ Stop</button>
  </div>

  <div class="videos">
    <div class="panel">
      <h3>📹 Webcam Feed</h3>
      <video id="webcam" autoplay playsinline muted></video>
    </div>
    <div class="panel">
      <h3>🌫️ Depth Map</h3>
      <canvas id="depthCanvas"></canvas>
    </div>
  </div>

  <div class="stats">
    <h3 style="margin-bottom: 15px; color: #a78bfa;">📊 Inference Stats</h3>
    <div class="stat-grid">
      <div class="stat-item"><div class="stat-label">Backend</div><div class="stat-value" id="statBackend">—</div></div>
      <div class="stat-item"><div class="stat-label">Camera Resolution</div><div class="stat-value" id="statCamRes">—</div></div>
      <div class="stat-item"><div class="stat-label">Inference Time</div><div class="stat-value" id="statTime">—</div></div>
      <div class="stat-item"><div class="stat-label">Average (last 10)</div><div class="stat-value" id="statAvg">—</div></div>
      <div class="stat-item"><div class="stat-label">FPS</div><div class="stat-value" id="statFps">—</div></div>
      <div class="stat-item"><div class="stat-label">Depth Map Size</div><div class="stat-value" id="statSize">—</div></div>
      <div class="stat-item"><div class="stat-label">Min / Max</div><div class="stat-value" id="statRange">—</div></div>
    </div>
  </div>

  <div class="panel">
    <h3>📋 Console Log</h3>
    <div class="log" id="log"></div>
  </div>
</div>

<script type="module">
const MODEL_ID = "onnx-community/depth-anything-v2-small";

const video = document.getElementById("webcam");
const depthCanvas = document.getElementById("depthCanvas");
const depthCtx = depthCanvas.getContext("2d");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");
const deviceSel = document.getElementById("deviceSel");
const dtypeSel = document.getElementById("dtypeSel");
const sizeSel = document.getElementById("sizeSel");
const nativeOpt = document.getElementById("nativeOpt");
const startBtn = document.getElementById("startBtn");
const runOnceBtn = document.getElementById("runOnceBtn");
const runLoopBtn = document.getElementById("runLoopBtn");
const stopBtn = document.getElementById("stopBtn");

let estimator = null;
let RawImageClass = null;
let loopRunning = false;
let isInferring = false;
let times = [];

function setStatus(msg, type = "") {
  statusEl.textContent = msg;
  statusEl.className = type;
}

function log(msg, type = "info") {
  const line = document.createElement("div");
  line.className = `log-line ${type}`;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}

async function startWebcam() {
  log("Requesting webcam access (1280x720)...");
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { 
      width: { ideal: 1280 }, 
      height: { ideal: 720 },
      facingMode: "user"
    },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise((r) => (video.onloadedmetadata = r));
  await video.play();
  
  const w = video.videoWidth;
  const h = video.videoHeight;
  log(`Webcam started: ${w}x${h}`, "success");
  
  // Update native option label
  nativeOpt.textContent = `native (${w}×${h})`;
  document.getElementById("statCamRes").textContent = `${w}×${h}`;
}

async function loadModel() {
  const device = deviceSel.value;
  let dtype = dtypeSel.value;

  if (device === "wasm" && dtype === "fp16") {
    dtype = "q8";
    dtypeSel.value = "q8";
    log("fp16 is WebGPU-only. Switched dtype to q8 for WASM.", "warn");
  }

  setStatus("Loading Hugging Face Transformers.js...", "loading");
  log("Importing transformers.js (v3)...");
  const { pipeline, env, RawImage } = await import(
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3"
  );
  RawImageClass = RawImage;

  if (device === "wasm") {
    env.backends.onnx.wasm.proxy = true;
    if (typeof crossOriginIsolated !== "undefined" && crossOriginIsolated) {
      env.backends.onnx.wasm.numThreads = navigator.hardwareConcurrency || 4;
      log(`Cross-origin isolated ✅ — WASM multithreading enabled (${env.backends.onnx.wasm.numThreads} threads)`, "success");
    } else {
      env.backends.onnx.wasm.numThreads = 1;
      log("⚠️ Not cross-origin isolated — WASM will run SINGLE-threaded.", "warn");
      log("Serve the page with COOP/COEP headers to unlock multithreading.", "warn");
    }
  } else {
    env.backends.onnx.wasm.proxy = false;
  }

  setStatus(`Loading ${MODEL_ID} (${device}, ${dtype})...`, "loading");
  log(`Creating depth estimation pipeline (device: ${device}, dtype: ${dtype})...`);

  if (estimator) {
    try { await estimator.model.dispose(); } catch (e) {}
    estimator = null;
    times = [];
  }

  estimator = await pipeline("depth-estimation", MODEL_ID, { device, dtype });
  log(`Model loaded on ${device} ✅`, "success");

  document.getElementById("statBackend").textContent =
    `${device} · ${dtype}${device === "wasm" ? ` · ${env.backends.onnx.wasm.numThreads}T` : ""}`;

  setStatus("Model loaded! Running warmup inference...", "loading");
  await runInference(true);
  setStatus(`Ready! (${device} / ${dtype})`, "success");
}

function grabFrame() {
  const sizeVal = sizeSel.value;
  let w, h;
  if (sizeVal === "native") { 
    w = video.videoWidth; 
    h = video.videoHeight; 
  } else { 
    w = h = parseInt(sizeVal, 10); 
  }

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  
  // For native resolution, we need to handle aspect ratio properly
  if (sizeVal === "native") {
    ctx.drawImage(video, 0, 0, w, h);
  } else {
    // For square sizes, maintain aspect ratio by letterboxing or cropping
    const videoAspect = video.videoWidth / video.videoHeight;
    const targetAspect = 1;
    
    let sx, sy, sw, sh;
    if (videoAspect > targetAspect) {
      // Video is wider, crop sides
      sh = video.videoHeight;
      sw = sh * targetAspect;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      // Video is taller, crop top/bottom
      sw = video.videoWidth;
      sh = sw / targetAspect;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  }
  
  const img = ctx.getImageData(0, 0, w, h);
  return new RawImageClass(img.data, w, h, 4);
}

function renderDepthMap(result) {
  const w = result.depth.width;
  const h = result.depth.height;
  const c = result.depth.channels;
  depthCanvas.width = w;
  depthCanvas.height = h;

  const data = result.depth.data;
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < data.length; i += c) {
    if (data[i] < min) min = data[i];
    if (data[i] > max) max = data[i];
  }

  const img = depthCtx.createImageData(w, h);
  if (c === 1) {
    for (let i = 0; i < data.length; i++) {
      const v = data[i];
      const idx = i * 4;
      img.data[idx] = v; img.data[idx+1] = v; img.data[idx+2] = v; img.data[idx+3] = 255;
    }
  } else {
    for (let i = 0; i < w * h; i++) {
      const idx = i * 4;
      img.data[idx]   = data[i*c];
      img.data[idx+1] = data[i*c + (c > 1 ? 1 : 0)];
      img.data[idx+2] = data[i*c + (c > 2 ? 2 : 0)];
      img.data[idx+3] = 255;
    }
  }
  depthCtx.putImageData(img, 0, 0);
  return { min, max };
}

async function runInference(warmup = false) {
  if (!estimator) { log("Model not loaded yet!", "error"); return; }
  if (isInferring) return;
  isInferring = true;

  try {
    const frameImg = grabFrame();
    const t0 = performance.now();
    const result = await estimator(frameImg);
    const t1 = performance.now();
    const ms = t1 - t0;

    if (!warmup) {
      times.push(ms);
      if (times.length > 10) times.shift();
    }

    const { min, max } = renderDepthMap(result);
    const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : ms;
    const fps = 1000 / avg;

    if (warmup) {
      log(`Warmup inference: ${ms.toFixed(1)} ms (includes compilation — not counted in stats)`, "warn");
    } else {
      log(`Inference time (${deviceSel.value}): ${ms.toFixed(1)} ms`, "success");
      log(`Depth map size: ${result.depth.width} x ${result.depth.height} | Min: ${min.toFixed(0)}, Max: ${max.toFixed(0)}`);
    }

    document.getElementById("statTime").textContent = `${ms.toFixed(1)} ms`;
    document.getElementById("statAvg").textContent = `${avg.toFixed(1)} ms`;
    document.getElementById("statFps").textContent = `${fps.toFixed(1)} fps`;
    document.getElementById("statSize").textContent = `${result.depth.width}×${result.depth.height}`;
    document.getElementById("statRange").textContent = `${min.toFixed(0)} / ${max.toFixed(0)}`;

    await new Promise(r => setTimeout(r, 5));
  } catch (err) {
    log(`Inference error: ${err.message}`, "error");
  } finally {
    isInferring = false;
  }
}

async function runLoop() {
  loopRunning = true;
  while (loopRunning) {
    await runInference();
    await new Promise(r => requestAnimationFrame(r));
  }
}

async function initialize() {
  startBtn.disabled = true;
  try {
    if (!video.srcObject) await startWebcam();
    await loadModel();
    runOnceBtn.disabled = false;
    runLoopBtn.disabled = false;
  } catch (err) {
    log(`Init failed: ${err.message}`, "error");
    setStatus(`Error: ${err.message}`, "error");
  }
  startBtn.disabled = false;
}

deviceSel.addEventListener("change", () => {
  if (deviceSel.value === "wasm" && dtypeSel.value === "fp16") dtypeSel.value = "q8";
  if (estimator) setStatus("Settings changed — click Start to reload the model.", "loading");
});
dtypeSel.addEventListener("change", () => {
  if (estimator) setStatus("Settings changed — click Start to reload the model.", "loading");
});

startBtn.addEventListener("click", initialize);
runOnceBtn.addEventListener("click", () => runInference());
runLoopBtn.addEventListener("click", () => {
  runLoopBtn.disabled = true;
  stopBtn.disabled = false;
  runLoop();
});
stopBtn.addEventListener("click", () => {
  loopRunning = false;
  runLoopBtn.disabled = false;
  stopBtn.disabled = true;
  log("Loop stopped.", "warn");
});
</script>
</body>
</html>
